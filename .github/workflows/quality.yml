name: Quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  retained-evaluation:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.12.10'
          python-version: '3.12.13'
          enable-cache: true
      - run: uv sync --locked --extra dev
      - name: Test retained metric, release-time, recovery and evidence contracts
        run: uv run --frozen --extra dev python scripts/quality.py
      - name: Verify original evidence with and without Python optimization
        run: |
          python3 -S scripts/verify_portfolio.py
          python3 -S -O scripts/verify_portfolio.py
          python3 -S examples/delayed_label_demo.py
      - name: Re-execute the canonical aggregate notebook and verify saved output
        run: uv run --frozen python scripts/execute_public_closeout.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: executed-final-forecast-review
          path: artifacts/28_final_research_closeout.reproduced.ipynb
          if-no-files-found: error
          retention-days: 14
