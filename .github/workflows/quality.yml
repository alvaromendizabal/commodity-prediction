name: Quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen --extra dev python scripts/quality.py
      - run: uv run --frozen python scripts/verify_publication.py
      - run: uv run --frozen python scripts/verify_risk_state_publication.py
