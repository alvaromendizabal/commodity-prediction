name: Market normalization source preflight
on:
  push:
    branches: [feat/market-normalization-research]
    paths: [.github/workflows/market-normalization-preflight.yml]
permissions:
  contents: write
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/market-normalization-research
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - name: Format only the new feature package and tests
        run: |
          uv run --frozen python -m ruff check --select I --fix src/commodity_prediction/domain/market_normalization tests/test_market_normalization.py
          uv run --frozen python -m ruff format src/commodity_prediction/domain/market_normalization tests/test_market_normalization.py
          uv run --frozen python -m ruff check src/commodity_prediction/domain/market_normalization tests/test_market_normalization.py
          uv run --frozen python -m mypy src/commodity_prediction/domain/market_normalization
      - name: Test causal features without private data or model fitting
        run: |
          uv run --frozen python -m pytest -q tests/test_market_normalization.py --junitxml=/tmp/market-normalization-tests.xml
      - name: Record source-only verification and commit
        run: |
          uv run --frozen python - <<'PY'
          import hashlib
          import json
          import subprocess
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from pathlib import Path
          allowed = {'src/commodity_prediction/domain/market_normalization/features.py', 'src/commodity_prediction/domain/market_normalization/run.py', 'src/commodity_prediction/domain/market_normalization/__init__.py', 'tests/test_market_normalization.py'}
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if not changed.issubset(allowed):
              raise SystemExit('Unexpected source change')
          suites = ET.parse('/tmp/market-normalization-tests.xml').getroot().findall('testsuite')
          counts = {key: sum(int(s.get(key, 0)) for s in suites) for key in ['tests', 'failures', 'errors', 'skipped']}
          if counts != {'tests': 11, 'failures': 0, 'errors': 0, 'skipped': 0}:
              raise SystemExit('Unexpected test outcome')
          report = {'project': 'commodity-prediction', 'study': 'market_normalization', 'status': 'source_preflight_passed', 'utc': datetime.now(timezone.utc).isoformat(), 'source_parent_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'tests': counts, 'lint': 'passed', 'format': 'passed', 'typecheck': 'passed', 'source_hashes': {name: hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in sorted(allowed)}, 'aws_experiment_executed': False, 'new_training_fits': 0, 'feature_gate': 'open', 'holdout_evaluated': False, 'blocker': 'AWS launch request was blocked by the connected tool safety check before AWS API execution; no new model score or EBS synchronization is claimed.'}
          Path('reports/market_normalization_preflight.json').write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/commodity_prediction/domain/market_normalization tests/test_market_normalization.py reports/market_normalization_preflight.json
          git commit -m 'Verify and format causal market-normalization feature source'
          git push origin HEAD:feat/market-normalization-research
