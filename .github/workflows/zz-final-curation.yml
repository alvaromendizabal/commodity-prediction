name: Apply final forecasting project
on:
  push:
    branches: [cleanup/final-project-20261018]
    paths: [.github/workflows/zz-final-curation.yml]
permissions:
  contents: write
jobs:
  curate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.12.10'
          python-version: '3.12.13'
          enable-cache: false
      - name: Apply the reviewed retained-component selection
        run: python3 .cleanup/apply.py
      - name: Lock the smaller actual dependency set and enforce the full quality gate
        run: |
          uv lock
          uv sync --frozen --extra dev
          uv run --frozen --extra dev ruff format src tests scripts examples
          uv run --frozen --extra dev ruff check --fix src tests scripts examples
          uv run --frozen --extra dev ruff format src tests scripts examples
          git rm -rf .cleanup
          uv run --frozen --extra dev python scripts/quality.py
      - name: Re-execute the genuine aggregate notebook and actual browser replay
        run: |
          uv run --frozen python scripts/execute_public_closeout.py
          python3 -B -S review/run.py --render
          python3 -B -S review/run.py --output "$RUNNER_TEMP/forecast-review" --with-node
          python3 -B -S review/run.py --output "$RUNNER_TEMP/forecast-review" --with-node --check
      - name: Publish source only to the cleanup branch
        run: |
          git add -A
          git diff --cached --check
          if git diff --cached --name-only | grep '^.github/workflows/'; then exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Retire unused forecasting implementations; retain final comparison and release-time contracts'
          git push origin HEAD:cleanup/final-project-20261018
          git archive --format=zip --output="$RUNNER_TEMP/source.zip" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/commit.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: final-forecast-source
          path: |
            ${{ runner.temp }}/source.zip
            ${{ runner.temp }}/commit.txt
          retention-days: 3
          if-no-files-found: error
