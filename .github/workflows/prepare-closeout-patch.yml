name: Prepare closeout patch
on:
  push:
    branches: [chore/research-closeout-20260922]
    paths: [.github/workflows/prepare-closeout-patch.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      NUMEXPR_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - name: Prepare source-only corrections and run unchanged quality gates
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen --extra dev python - <<'PY'
          import hashlib
          import json
          import pathlib
          import subprocess
          import sys
          import zipfile

          root = pathlib.Path.cwd()
          out = root / 'ci_publication_patch'
          out.mkdir()
          python_paths = [
              'scripts/execute_round21a_notebook.py',
              'scripts/run_competitive_feature_forecast.py',
              'scripts/run_third_place_reproduction.py',
              'src/commodity_prediction/competitive/feature_forecast.py',
              'src/commodity_prediction/competitive/third_place_reproduction.py',
              'tests/test_competitive_feature_forecast.py',
              'tests/test_third_place_reproduction.py',
          ]
          paths = python_paths + ['.github/workflows/quality.yml']
          before = {p: hashlib.sha256((root / p).read_bytes()).hexdigest() for p in paths}
          p = root / 'scripts/run_competitive_feature_forecast.py'
          text = p.read_text()
          old = 'def maker(space=space, variant=variant, stage=stage):'
          new = 'def maker(space=space, variant=variant, stage=stage, fold=fold, prediction_positions=prediction_positions, truth=truth, baseline_daily=baseline_daily):'
          if text.count(old) != 1:
              raise RuntimeError('Unexpected closure source; no speculative patch')
          p.write_text(text.replace(old, new))
          p = root / 'scripts/run_third_place_reproduction.py'
          text = p.read_text()
          a = text.index('ROOT = Path(')
          b = text.index('from commodity_prediction.data import')
          c = text.index('\ndef utc()')
          constants = text[a:b]
          line = 'sys.path.insert(0, str(ROOT / "src"))'
          if constants.count(line) != 1:
              raise RuntimeError('Unexpected import bootstrap source')
          constants = constants.replace(line, '').strip()
          imports = text[b:c].strip()
          bootstrap = 'sys.path.insert(0, str(Path(__file__).resolve().parents[1] / "src"))'
          p.write_text(text[:a] + bootstrap + '\n\n' + imports + '\n\n\n' + constants + '\n\n' + text[c:])
          p = root / 'src/commodity_prediction/competitive/feature_forecast.py'
          text = p.read_text()
          old = 'from typing import Callable'
          if text.count(old) != 1 or text.count('model: object,') != 1 or text.count('tuple[object, ScaleState, dict]') != 1:
              raise RuntimeError('Unexpected forecast annotation source')
          text = text.replace(old, 'from typing import TYPE_CHECKING, Callable')
          anchor = 'from commodity_prediction.metrics import correlation_sharpe, daily_rank_correlations'
          if text.count(anchor) != 1:
              raise RuntimeError('Unexpected forecast imports')
          text = text.replace(anchor, anchor + '\n\nif TYPE_CHECKING:\n    from torch.nn import Module')
          text = text.replace('model: object,', 'model: Module,').replace('tuple[object, ScaleState, dict]', 'tuple[Module, ScaleState, dict]')
          p.write_text(text)
          p = root / '.github/workflows/quality.yml'
          text = p.read_text()
          anchor = '    runs-on: ubuntu-latest\n'
          if text.count(anchor) != 1:
              raise RuntimeError('Unexpected Quality job structure')
          text = text.replace(anchor, anchor + "    env:\n      OMP_NUM_THREADS: '2'\n      OPENBLAS_NUM_THREADS: '2'\n      MKL_NUM_THREADS: '2'\n      NUMEXPR_NUM_THREADS: '2'\n")
          p.write_text(text)

          results = []
          commands = [
              ['ruff', 'check', '--fix', *python_paths],
              ['ruff', 'format', *python_paths],
              ['ruff', 'check', 'src', 'tests', 'scripts'],
              ['ruff', 'format', '--check', 'src', 'tests', 'scripts'],
              ['mypy', 'src'],
              ['pytest', '-q', 'tests/test_competitive_feature_forecast.py', 'tests/test_third_place_reproduction.py'],
          ]
          for i, args in enumerate(commands):
              try:
                  run = subprocess.run([sys.executable, '-m', *args], text=True, capture_output=True, timeout=120)
                  code, output = run.returncode, run.stdout + '\n' + run.stderr
              except subprocess.TimeoutExpired as exc:
                  code, output = 124, repr(exc) + '\n' + str(exc.stdout or '') + '\n' + str(exc.stderr or '')
              (out / ('check_%02d.log' % i)).write_text(output)
              results.append({'command': args, 'returncode': code})
              print('CHECK', i, args[0], 'EXIT', code, '\n', output[:18000], flush=True)
          if all(r['returncode'] == 0 for r in results):
              try:
                  run = subprocess.run([sys.executable, '-m', 'pytest', '-q'], text=True, capture_output=True, timeout=240)
                  code, output = run.returncode, run.stdout + '\n' + run.stderr
              except subprocess.TimeoutExpired as exc:
                  code, output = 124, repr(exc) + '\n' + str(exc.stdout or '')
              results.append({'command': ['pytest', '-q'], 'returncode': code})
              (out / 'full_pytest.log').write_text(output)
              print('FULL_TEST_EXIT', code, '\n', output[:18000], flush=True)
          diff = subprocess.run(['git', 'diff', '--', *paths], check=True, text=True, capture_output=True)
          (out / 'publication_ci_cleanup.diff').write_text(diff.stdout)
          payload = []
          for name in paths:
              data = (root / name).read_bytes()
              after = hashlib.sha256(data).hexdigest()
              if after != before[name]:
                  payload.append({'path': name, 'before_sha256': before[name], 'after_sha256': after, 'bytes': len(data)})
          manifest = {'source_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'files': payload, 'checks': results, 'ready': all(r['returncode'] == 0 for r in results), 'new_project_model_fits': 0, 'scope': 'source quality corrections and two-thread CI limits; no experiment or notebook-output changes; no check removed'}
          (out / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          with zipfile.ZipFile(out / 'source_patch.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for item in payload:
                  z.write(root / item['path'], item['path'])
          print('PATCH_READY', manifest['ready'], flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commodity-publication-ci-patch
          path: ci_publication_patch/
          retention-days: 7
          if-no-files-found: error
