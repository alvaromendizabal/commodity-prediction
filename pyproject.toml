[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "commodity-prediction"
version = "0.1.0"
description = "Point-in-time commodity forecasting and feature research"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.2,<3",
  "pandas>=3,<4",
  "scipy>=1.15,<2",
  "scikit-learn>=1.7,<2",
  "plotly>=6,<8",
  "pyarrow>=20,<26",
  "nbformat>=5.10,<6",
  "nbclient>=0.10,<1",
  "ipykernel>=6.29,<8",
  "boto3>=1.38,<2",
  "threadpoolctl>=3.6,<4",
  "kaleido>=1.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "mypy>=1.15,<3"]

[project.scripts]
commodity = "commodity_prediction.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/commodity_prediction"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
files = ["src"]
